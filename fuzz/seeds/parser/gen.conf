# ngx-spec: {"domain":"new.example.com","aliases":[],"inbound":80,"backend":{"type":"proxy","host":"127.0.0.1","port":3005,"websocket":false},"ssl":{"mode":"none"},"redirect_http":false,"max_body":"20m","routes":[{"path":"/api/","host":"127.0.0.1","port":9000}]}

server {
    listen 80;
    listen [::]:80;
    server_name new.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ngx/acme;
        default_type text/plain;
        auth_basic off;
    }

    access_log /var/log/nginx/new.example.com.access.log ngx;
    error_log  /var/log/nginx/new.example.com.error.log;

    client_max_body_size 20m;

    # your own directives: /etc/nginx/ngx.d/new.example.com/*.conf (kept when ngx regenerates this file)
    include /etc/nginx/ngx.d/new.example.com/*.conf;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}