name: Release

# Push a tag like v0.2.0 to build static Linux binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (for aarch64)
        if: startsWith(matrix.target, 'aarch64')
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            cargo build --release --locked --target ${{ matrix.target }}
          else
            cross build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          name=ngx-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/ngx dist/$name/
          cp -r man completions README.md dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - name: Debian package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --no-strip --target ${{ matrix.target }} --output dist/
          (cd dist && for f in *.deb; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS
          generate_release_notes: true
